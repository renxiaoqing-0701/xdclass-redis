server:
  port: 8080
spring:
  redis:
    host: 8.163.20.123
    port: 6379
    password: 25802580Rxq
    #指定客户端
    client-type: lettuce

    lettuce:
      pool:
        # 连接池最大连接数（使用负值表示没有限制）
        max-active: 10
        # 连接池中的最大空闲连接
        max-idle: 10
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms
    jedis:
      pool:
        # 连接池最大连接数（使用负值表示没有限制）
        max-active: 10
        # 连接池中的最大空闲连接
        max-idle: 10
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms
  cache:
    #指定缓存类型
    type: redis
    #过时时间
    redis:
      time-to-live: 3600000
      # 开启前缀，默以为true
      use-key-prefix: true
      # 键的前缀,默认就是缓存名cacheNames
      key-prefix: XD_CACHE
      # 是否缓存空结果，防止缓存穿透，默以为true
      cache-null-values: true
  #==============================数据库相关配置========================================
  #数据库配置
  datasource:
